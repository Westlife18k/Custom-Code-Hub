openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: packages
    description: Public package listings
  - name: payments
    description: Paystack checkout and verification
  - name: orders
    description: Verified purchase lookup
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List active packages
      responses:
        "200":
          description: Active package details without private codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicPackage"
        "503":
          description: Package data service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/initialize:
    post:
      operationId: initializePayment
      tags: [payments]
      summary: Initialize a GHS Paystack checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInitializeInput"
      responses:
        "200":
          description: Hosted checkout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitializeResponse"
        "400":
          description: Invalid purchase details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Active package not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Paystack could not start the selected method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment or order service is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/verify:
    post:
      operationId: verifyPayment
      tags: [payments]
      summary: Verify a payment with Paystack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentVerifyInput"
      responses:
        "200":
          description: Verified payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerifyResponse"
        "400":
          description: Invalid payment reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Payment is not confirmed or does not match the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment or order service is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/webhook:
    post:
      operationId: receivePaystackWebhook
      tags: [payments]
      summary: Receive signed Paystack events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaystackWebhookEvent"
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "401":
          description: Webhook signature is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/lookup:
    post:
      operationId: lookupOrder
      tags: [orders]
      summary: Retrieve a code for a verified purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderLookupInput"
      responses:
        "200":
          description: Code attached to a verified purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCode"
        "400":
          description: Invalid lookup details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No verified purchase found for the supplied details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Order service is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublicPackage:
      type: object
      required: [id, title, price_kobo]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        price_kobo:
          type: integer
        total_odds:
          type: [string, "null"]
        match_count:
          type: [integer, "null"]
    PaymentInitializeInput:
      type: object
      required: [packageId, email, channel]
      properties:
        packageId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        channel:
          type: string
          enum: [bank_transfer, mobile_money]
    PaymentInitializeResponse:
      type: object
      required: [authorization_url, reference]
      properties:
        authorization_url:
          type: string
          format: uri
        reference:
          type: string
          pattern: "^BCH-[a-f0-9]{32}$"
    PaymentVerifyInput:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          pattern: "^BCH-[a-f0-9]{32}$"
    PaymentVerifyResponse:
      type: object
      required: [success, reference]
      properties:
        success:
          type: boolean
        reference:
          type: string
    OrderLookupInput:
      type: object
      required: [email, reference]
      properties:
        email:
          type: string
          format: email
        reference:
          type: string
          pattern: "^BCH-[a-f0-9]{32}$"
    OrderCode:
      type: object
      required: [title, code]
      properties:
        title:
          type: string
        code:
          type: string
    PaystackWebhookEvent:
      type: object
      required: [event]
      properties:
        event:
          type: string
      additionalProperties: true
    WebhookAck:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

